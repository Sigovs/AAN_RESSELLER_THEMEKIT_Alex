<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Gen 11 — final visual rework · family contact sheet</title>
<style>
:root{--ink:#16212f;--muted:#5a6b80;--line:#d4dbe4;--page:#eef1f5}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.5 "Archivo","Segoe UI",system-ui,sans-serif;padding:24px}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
figure{margin:0;background:#fff;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
img{display:block;width:100%;height:auto}
figcaption{padding:6px 9px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
</style></head><body>
<h1>AAN Gen 11 — final visual rework</h1>
<p class="sub">Ten pages at 1440&times;900, after. One header family, one mark, one radius scale, one five-surface palette.</p>
<div class="grid">
<figure><img src="after/01-dealer-login.png" alt="Dealer Login"><figcaption>01 Dealer Login</figcaption></figure>
<figure><img src="after/02-all-vehicles.png" alt="All Vehicles"><figcaption>02 All Vehicles</figcaption></figure>
<figure><img src="after/03-single-vehicle.png" alt="Single Vehicle"><figcaption>03 Single Vehicle</figcaption></figure>
<figure><img src="after/04-all-leads.png" alt="All Leads"><figcaption>04 All Leads</figcaption></figure>
<figure><img src="after/05-single-lead.png" alt="Single Lead"><figcaption>05 Single Lead</figcaption></figure>
<figure><img src="after/06-my-work-queue.png" alt="My Work Queue"><figcaption>06 My Work Queue</figcaption></figure>
<figure><img src="after/07-single-ticket.png" alt="Single Ticket"><figcaption>07 Single Ticket</figcaption></figure>
<figure><img src="after/08-manage-dealers.png" alt="Manage Dealers"><figcaption>08 Manage Dealers</figcaption></figure>
<figure><img src="after/09-dealer-edit.png" alt="Dealer Edit"><figcaption>09 Dealer Edit</figcaption></figure>
<figure><img src="after/10-accounting-view-all.png" alt="Accounting — View All"><figcaption>10 Accounting</figcaption></figure>
</div>
