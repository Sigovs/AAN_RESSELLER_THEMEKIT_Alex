      </div>

  </header>

  <!-- ══ RECORD HEAD ══════════════════════════════════════════════════════
       Everything above the form is READ-ONLY: what this record is, what state
       it is in, when it was created and touched, and where else it lives.
       Nothing here is a field, and nothing here looks like one. -->
  <header class="head" id="head"></header>

  <!-- ══ BODY ═════════════════════════════════════════════════════════════
       rail (where am I) · zones (the record) · side (what surrounds it) -->
  <div class="body" id="body">
    <nav class="rail" id="rail" aria-label="Dealer file sections"></nav>
    <div class="zones" id="zones"></div>
    <aside class="side" id="side" aria-label="Notes, options and locks"></aside>
  </div>

  <!-- ══ SAVE BAR — FLOATING, and the only thing that commits ═════════════ -->
  <div class="savebar" id="savebar" role="status">
    <span class="savebar__dirty" id="dirty" hidden><svg class="i"><use href="#i-alert"/></svg> Unsaved changes</span>
    <span class="savebar__sp"></span>
    <button class="btn btn--quiet" type="button" id="discard" hidden
            title="Throw away unsaved edits and reload the stored record">Discard</button>
    <button class="btn btn--sheet" type="button" id="temp" hidden>Temporary Save</button>
    <button class="btn btn--primary" type="button" id="save">Save Dealer</button>
    <span class="savebar__kbd"><kbd>Ctrl</kbd>+<kbd>S</kbd></span>
  </div>

  <p class="nojs">This dealer file is rendered by script. Enable JavaScript to open the record.</p>
